# Unstable prerelease: standalone `l4` + `jl4-lsp` binaries, built from
# legalese/l4-ide's `unstable` branch and published to THIS repo's releases.
#
# ---------------------------------------------------------------------------
# WHY THIS LIVES HERE AND NOT IN l4-ide
#
# Releases and tags are repo-scoped, not branch-scoped: a prerelease cut
# "from unstable" in l4-ide still lands on l4-ide's one releases page, in its
# one tag namespace, notifying its watchers — a surface its maintainers keep
# for the stable track. The one prerelease published there
# (unstable-20260805-c873bb5, 2026-08-05) was deleted within days; its git
# tag still lingers in l4-ide because that workflow tagged the dev repo.
#
# This repo is the shelf. The workflow checks out legalese/l4-ide (public —
# no token needed), builds, and releases to ITSELF with its own GITHUB_TOKEN.
# l4-ide carries no trace: no workflow file, no Actions runs, no tag, no
# release. And because this file sits on the shelf's default branch, the web
# Run-workflow button works — the thing that forced `gh workflow run --ref
# unstable` gymnastics when the file lived on l4-ide's non-default branch.
#
# Adapted 2026-08-10 from l4-ide's .github/workflows/unstable-prerelease.yml
# (branch unstable), whose foot-of-file notes record the measured history of
# every step below: three runs (31011661044 dry, 31015006781 real,
# 31302358588 dry) proved the build/stage/smoke/checksum path end to end on
# all three platforms, the dry-run guard, and the release rendering. What is
# NEW here and unproven until this file's own first runs: the cross-repo
# checkout, tagging the shelf instead of the source, and this repo's own
# cache. Exercise with `dry_run: true` first — that path builds, packages,
# smoke-tests and checksums without creating a tag or a release.
#
# No `schedule:` trigger: publishing is an outward-facing act, so a human
# decides when it happens. (Unlike the l4-ide-hosted ancestor, a cron would
# actually fire here — this is the default branch — so its absence is now
# purely a decision, not also a mechanism.)
# ---------------------------------------------------------------------------
name: Unstable Prerelease (l4 + jl4-lsp)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "legalese/l4-ide branch, tag or SHA to build. Must not be main."
        required: false
        default: "unstable"
        type: string
      dry_run:
        description: "Build, package and checksum, but create NO tag and NO release. Leave checked until this workflow has been proven once."
        required: false
        default: true
        type: boolean
      tag_suffix:
        description: "Disambiguator, e.g. 2, appended to the tag. Only needed when re-publishing the same commit on the same UTC day."
        required: false
        default: ""
        type: string

concurrency:
  group: unstable-prerelease
  cancel-in-progress: false

# Least privilege by default; `publish` widens this to contents: write for
# itself alone (tag + release on THIS repo). The build jobs cannot write
# anywhere, and nothing here can write to legalese/l4-ide at all.
permissions:
  contents: read

env:
  # The repo this shelf builds. Everything checked out below is this, pinned
  # to one SHA by the resolve job.
  SOURCE_REPO: legalese/l4-ide
  # 9.10.2 is the version proven green on all three runner images by the
  # ancestor workflow's runs (l4-ide builds locally with 9.10.3; CI pins
  # 9.10.2 — see l4-ide's pr-checks.yml and main-tag.yml, which use the same).
  GHC_VERSION: "9.10.2"

jobs:
  # =========================================================================
  # Resolve the commit, compute the tag, and refuse bad inputs BEFORE we
  # spend thirty minutes of runner time discovering them.
  # =========================================================================
  resolve:
    name: Resolve ref and tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      tag: ${{ steps.plan.outputs.tag }}
      built_at: ${{ steps.plan.outputs.built_at }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Guard first, checkout second: a `main` dispatch should cost nothing.
      - name: Refuse to build main
        env:
          REF: ${{ inputs.ref || 'unstable' }}
        run: |
          case "$REF" in
            main|refs/heads/main|origin/main)
              echo "::error::This shelf publishes the UNSTABLE prerelease track and must not"
              echo "::error::build main. main's release pipeline is l4-ide's main-tag.yml,"
              echo "::error::which cuts l4-ide-build-<n> tags and marks them Latest. Refusing."
              exit 1
              ;;
          esac
          echo "Building $SOURCE_REPO ref: $REF"

      - uses: actions/checkout@v5
        with:
          repository: legalese/l4-ide
          ref: ${{ inputs.ref || 'unstable' }}
          fetch-depth: 1

      - name: Compute commit, tag and publish decision
        id: plan
        env:
          REF: ${{ inputs.ref || 'unstable' }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=7 HEAD)"
          DATE="$(date -u +%Y%m%d)"

          # Tag namespace: `unstable-<YYYYMMDD>-<short-sha>`. The date sorts
          # lexicographically and the short SHA names the SOURCE commit — the
          # tag itself points at this shelf repo's HEAD (there is nothing else
          # here for it to point at; provenance lives in the tag name, the
          # annotated tag message, BUILD-INFO.txt and the release body).
          #
          # TAGS ARE IMMUTABLE. This workflow never moves or deletes a tag. A
          # moving tag ("unstable-latest") would silently change what a
          # previously-recorded checksum refers to, which is exactly what the
          # SHA256SUMS file exists to prevent. Re-publishing the same commit
          # on the same UTC day therefore collides; `tag_suffix` is the escape
          # hatch, and this pre-flight fails fast rather than late.
          if [ -n "${TAG_SUFFIX:-}" ]; then
            case "$TAG_SUFFIX" in
              *[!A-Za-z0-9._-]*)
                echo "::error::tag_suffix must match [A-Za-z0-9._-]* — got '$TAG_SUFFIX'"
                exit 1
                ;;
            esac
            TAG="unstable-${DATE}-${SHORT}-${TAG_SUFFIX}"
          else
            TAG="unstable-${DATE}-${SHORT}"
          fi

          # The collision check runs against THIS repo — the shelf owns the
          # tag namespace now. Unauthenticated ls-remote is fine: public repo.
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on ${GITHUB_REPOSITORY}, and this workflow never moves a tag."
            echo "::error::To publish this commit again, re-run with tag_suffix set (e.g. 2)."
            exit 1
          fi

          # Default-deny. Only the literal string "false" publishes; anything
          # else — including a null `inputs` context on some future trigger —
          # leaves this a dry run.
          if [ "${DRY_RUN:-}" = "false" ]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          {
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "short_sha=$SHORT"
            echo "tag=$TAG"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Unstable prerelease plan"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| source | \`$SOURCE_REPO\` |"
            echo "| ref | \`$REF\` |"
            echo "| commit | \`$SHA\` |"
            echo "| tag | \`$TAG\` |"
            echo "| publish | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Build both binaries, per platform.
  #
  # Every platform checks out the SHA the `resolve` job pinned, never the
  # branch name: a push to unstable mid-run must not produce a release whose
  # linux binary and macOS binary are different programs.
  # =========================================================================
  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` reuses l4-ide main-tag.yml's VS Code target naming
          # (darwin-arm64 / win32-x64 / linux-x64) so one vocabulary describes
          # both tracks.
          - platform: linux-x64
            runs-on: ubuntu-latest
            exe: ""
          - platform: darwin-arm64
            runs-on: macos-latest
            exe: ""
          # Windows is included because it is proven, not assumed: the
          # ancestor workflow built and smoke-tested it green on all runs.
          - platform: win32-x64
            runs-on: windows-latest
            exe: ".exe"

    # bash on every platform, including Windows (Git Bash), so the steps
    # below are written once.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          repository: legalese/l4-ide
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: true

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "Retry $i: apt-get update failed, waiting 10s..."
            sleep 10
          done
          sudo apt-get install -y pkg-config liblzma-dev libgmp-dev

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      # Configure BEFORE the cache restore: the restore key hashes plan.json,
      # which `--dry-run` is what writes.
      #
      # `--disable-tests`: this workflow publishes binaries. Correctness
      # gating for `unstable` is l4-ide pr-checks.yml's job — it runs
      # `cabal test all` on every PR into the branch. What this workflow owes
      # on top of that is proof the ARTIFACT runs, which is the smoke test
      # further down.
      - name: Configure and generate build plan
        run: |
          cabal update
          cabal configure --disable-tests --disable-documentation
          cabal build exe:l4 exe:jl4-lsp --dry-run

      # This repo SAVES its own cache, unlike the l4-ide-hosted ancestor,
      # which was restore-only. The ancestor's two reasons no longer apply
      # here: (1) l4-ide's 10 GB cache budget was shared with PR CI and a
      # save here could evict the caches PRs depend on — this repo's 10 GB
      # budget has no other tenant at all; (2) the borrow from main-tag.yml's
      # `lsp-*` families cannot work anyway, because caches are REPO-scoped
      # and this is a different repo. First run per platform is a cold
      # Haskell build (~21-24 min, measured by the ancestor's runs); runs
      # inside a 7-day window of the last one restore warm (~6-7 min).
      - name: Cache cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: shelf-${{ matrix.platform }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: |
            shelf-${{ matrix.platform }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-
            shelf-${{ matrix.platform }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-

      - name: Build l4 and jl4-lsp
        run: cabal build exe:l4 exe:jl4-lsp

      # The archive extracts to a directory of its own name — `tar -xzf
      # l4-<tag>-<platform>.tar.gz` yields `l4-<tag>-<platform>/`, never a
      # scatter of files into the current directory.
      - name: Stage the payload
        id: stage
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          DIR="l4-${TAG}-${{ matrix.platform }}"
          mkdir -p "stage/${DIR}/libraries" dist

          # Unquoted $(cabal list-bin ...) is the form proven to work with
          # the backslashed path cabal prints on Windows. GITHUB_WORKSPACE
          # contains no spaces on any runner image.
          cp $(cabal list-bin exe:l4)       "stage/${DIR}/l4${{ matrix.exe }}"
          cp $(cabal list-bin exe:jl4-lsp)  "stage/${DIR}/jl4-lsp${{ matrix.exe }}"

          # strip BEFORE codesign: stripping a Mach-O invalidates its signature.
          if [ "${{ matrix.platform }}" != "win32-x64" ]; then
            strip "stage/${DIR}/l4"      || true
            strip "stage/${DIR}/jl4-lsp" || true
            chmod +x "stage/${DIR}/l4" "stage/${DIR}/jl4-lsp"
          fi
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            codesign -s - "stage/${DIR}/l4"      || true
            codesign -s - "stage/${DIR}/jl4-lsp" || true
          fi

          # The standard library is embedded in the binary by a Template
          # Haskell splice at compile time, so these copies are NOT required
          # to run `l4`. They are here so a standalone user can point
          # JL4_LIBRARY_PATH somewhere if they ever need to. Pipeline users
          # should not set it: etc/go/ defaults it to the repo's own copy.
          cp jl4-core/libraries/*.l4 "stage/${DIR}/libraries/"

          cat > "stage/${DIR}/BUILD-INFO.txt" <<EOF
          l4 + jl4-lsp — UNSTABLE PRERELEASE. Not a stable release.

          tag       ${TAG}
          source    ${SOURCE_REPO}
          commit    ${{ needs.resolve.outputs.sha }}
          ref       ${{ needs.resolve.outputs.ref }}
          platform  ${{ matrix.platform }}
          ghc       ${{ steps.setup.outputs.ghc-version }}
          built     ${{ needs.resolve.outputs.built_at }}
          run       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Built from ${SOURCE_REPO}'s long-lived integration branch
          \`unstable\`, which is not the stable line. For a stable build use
          the VS Code extension released from that repo's main by
          .github/workflows/main-tag.yml.
          EOF

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -l "stage/${DIR}"

      # Prove the artifact runs, and prove its vintage. `l4 --help` listing an
      # `export` command is the specific check this whole track exists for:
      # the binary bundled in the newest VS Code extension (2026-07-18)
      # predates `l4 export` and therefore cannot drive the DMN/BPMN
      # projections. It has to be `l4 --help`, not `l4 export --help`: older
      # subcommands answer "Invalid option `--help'".
      - name: Smoke-test the staged binaries
        env:
          DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          L4B="stage/${DIR}/l4${{ matrix.exe }}"
          LSPB="stage/${DIR}/jl4-lsp${{ matrix.exe }}"

          # Workspace-relative scratch files on purpose: $RUNNER_TEMP is a
          # backslashed Windows path, and backslashes are escapes in bash.
          "$L4B" --help > smoke-l4-help.txt
          if ! grep -q '^  export ' smoke-l4-help.txt; then
            echo "::error::The built l4 does not list an 'export' subcommand. Publishing it"
            echo "::error::would repeat the defect this release track exists to fix."
            cat smoke-l4-help.txt
            exit 1
          fi
          echo "l4 --help lists $(grep -c '^  [a-z]' smoke-l4-help.txt) subcommands, including export"

          "$LSPB" --help < /dev/null > smoke-lsp-help.txt
          grep -q 'language server' smoke-lsp-help.txt || {
            echo "::error::jl4-lsp --help did not identify itself as the language server."
            cat smoke-lsp-help.txt
            exit 1
          }

      # Archive INSIDE the platform job, not after download:
      # actions/upload-artifact does not preserve the executable bit; a
      # tarball does.
      - name: Archive
        env:
          DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          tar -czf "dist/${DIR}.tar.gz" -C stage "${DIR}"
          ls -lh dist/

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0 # already gzipped
          retention-days: 30

  # =========================================================================
  # Collect, checksum, and (unless this is a dry run) tag and publish — to
  # THIS repo.
  #
  # Checksums are computed on EVERY run, dry or not, so a dry run is a
  # complete rehearsal that produces every artifact the real thing would.
  # Only the two outward-facing steps — the tag push and the release — are
  # gated.
  # =========================================================================
  publish:
    name: Checksum and publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag push + release creation on THIS repo; no other job has this
    steps:
      # This checkout is the SHELF itself (the default), because the tag
      # lives here now: it points at this repo's HEAD, and the annotated tag
      # message carries the source provenance. fetch-depth: 0 because pushing
      # from a shallow clone is the kind of thing that works until it does
      # not, and this repo is a handful of commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: archive-*

      # Flatten with find rather than with download-artifact's
      # `merge-multiple` — one fewer action input to be right about.
      - name: Flatten into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -lh dist/

      # Fail loudly on a partial set. `fail-fast: false` on the build matrix
      # means one platform can fail while the others succeed; publishing two
      # thirds of a release silently is worse than publishing nothing.
      - name: Verify the archive set is complete
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          MISSING=0
          for P in linux-x64 darwin-arm64 win32-x64; do
            F="l4-${TAG}-${P}.tar.gz"
            if [ ! -f "$F" ]; then
              echo "::error::Missing archive $F"
              MISSING=1
            fi
          done
          ls -lh
          [ "$MISSING" -eq 0 ]

      # Bare filenames, so `sha256sum -c SHA256SUMS` works from the directory
      # the archives were downloaded into.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum l4-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload SHA256SUMS as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Compose the release body
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Unstable prerelease — NOT a stable release"
            echo ""
            echo "Standalone \`l4\` and \`jl4-lsp\` binaries built from [\`${SOURCE_REPO}\`](${{ github.server_url }}/${SOURCE_REPO})"
            echo "at **\`${{ needs.resolve.outputs.ref }}\`**, the long-lived integration branch. \`unstable\` is where"
            echo "feature branches land before a release; it is not the stable line and carries no"
            echo "compatibility promise. Stable builds are the VS Code extensions released from that"
            echo "repo's \`main\` under the \`l4-ide-build-<n>\` tags."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`${SOURCE_REPO}\` |"
            echo "| commit | \`${{ needs.resolve.outputs.sha }}\` |"
            echo "| branch | \`${{ needs.resolve.outputs.ref }}\` |"
            echo "| built | ${{ needs.resolve.outputs.built_at }} |"
            echo "| GHC | ${{ env.GHC_VERSION }} |"
            echo "| workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "### Downloads"
            echo ""
            echo "Each archive extracts to a directory of the same name, containing \`l4\`,"
            echo "\`jl4-lsp\`, a \`libraries/\` copy of the L4 standard library, and \`BUILD-INFO.txt\`."
            echo ""
            echo "| platform | archive |"
            echo "|----------|---------|"
            echo "| Linux x86-64 | \`l4-${TAG}-linux-x64.tar.gz\` |"
            echo "| macOS Apple Silicon | \`l4-${TAG}-darwin-arm64.tar.gz\` |"
            echo "| Windows x64 | \`l4-${TAG}-win32-x64.tar.gz\` |"
            echo ""
            echo "\`\`\`bash"
            echo "TAG=${TAG}"
            echo "PLATFORM=linux-x64   # or darwin-arm64, win32-x64"
            echo "BASE=${{ github.server_url }}/${{ github.repository }}/releases/download/\$TAG"
            echo "curl -fsSLO \"\$BASE/l4-\$TAG-\$PLATFORM.tar.gz\""
            echo "curl -fsSLO \"\$BASE/SHA256SUMS\""
            echo "sha256sum --ignore-missing -c SHA256SUMS   # macOS without coreutils: shasum -a 256 --ignore-missing -c SHA256SUMS"
            echo "tar -xzf \"l4-\$TAG-\$PLATFORM.tar.gz\""
            echo "export L4=\"\$PWD/l4-\$TAG-\$PLATFORM/l4\""
            echo "export JL4_LSP_CMD=\"\$PWD/l4-\$TAG-\$PLATFORM/jl4-lsp\""
            echo "\`\`\`"
            echo ""
            echo "macOS: the binaries are ad-hoc signed on the runner, but Gatekeeper still"
            echo "quarantines downloads. If launching is refused, clear the attribute:"
            echo ""
            echo "\`\`\`bash"
            echo "xattr -dr com.apple.quarantine \"l4-\$TAG-darwin-arm64\""
            echo "\`\`\`"
            echo ""
            echo "Windows: \`tar -xzf\` is built in on Windows 10 1803 and later, in both"
            echo "PowerShell and cmd."
            echo ""
            echo "See [\`etc/go/README.md\`](${{ github.server_url }}/${SOURCE_REPO}/blob/${{ needs.resolve.outputs.sha }}/etc/go/README.md) for what the pipeline does with these."
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run — stopping before the tag
        if: needs.resolve.outputs.publish != 'true'
        run: |
          echo "::notice::DRY RUN. Built and checksummed ${{ needs.resolve.outputs.tag }} but created"
          echo "::notice::no tag and no release. Re-run with dry_run unchecked to publish."
          {
            echo ""
            echo "> **Dry run.** No tag was pushed and no release was created."
            echo "> Archives and \`SHA256SUMS\` are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      # Annotated tag on THIS repo's HEAD, pushed with git, then handed to
      # the release action. The tag cannot point at the source commit — that
      # commit is not in this repo — so its provenance rides in the tag NAME
      # (date + source short-SHA) and in this message, readable with
      # `git show <tag>` by someone who has only a clone of the shelf.
      - name: Create and push the tag
        if: needs.resolve.outputs.publish == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Unstable prerelease $TAG

          NOT a stable release. Built from ${SOURCE_REPO}'s integration
          branch ${{ needs.resolve.outputs.ref }}.

          Source commit: ${{ needs.resolve.outputs.sha }}
          Built:         ${{ needs.resolve.outputs.built_at }}
          Run:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Artifacts: standalone l4 + jl4-lsp for linux-x64, darwin-arm64,
          win32-x64, with SHA256SUMS."
          git push origin "$TAG"

      - name: Publish the prerelease
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: l4 + jl4-lsp — unstable prerelease ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          # Belt and braces even on a shelf with no stable track: `prerelease`
          # marks it Pre-release in the UI; `make_latest: "false"` says so
          # explicitly to the API.
          prerelease: true
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
